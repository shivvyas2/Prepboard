  function hairSVG(a) {
    const h = a.hair;
    switch (a.style) {
      case "fringe": return `<path d="M16 36a16 16 0 0 1 32 0c-5-6-11-7-16-5-5-2-11-1-16 5z" fill="${h}"/>`;
      case "bun": return `<circle cx="32" cy="15" r="6.5" fill="${h}"/><path d="M16.5 34a15.5 15.5 0 0 1 31 0c-6-5-25-5-31 0z" fill="${h}"/>`;
      case "curly": return [[20,25],[26,20],[33,18],[40,21],[45,27],[17,32],[47,33]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="6" fill="${h}"/>`).join("");
      case "long": return `<path d="M14 38a18 18 0 0 1 36 0v14h-7V38H21v14h-7z" fill="${h}"/>`;
      case "short": return `<path d="M17 33a15 15 0 0 1 30 0c-4-4-10-6-15-6s-11 2-15 6z" fill="${h}"/>`;
      default: return `<circle cx="26" cy="37" r="4.2" fill="none" stroke="${a.bg === "#1d1a16" ? "#fffdf9" : "#1d1a16"}" stroke-width="1.6"/><circle cx="38" cy="37" r="4.2" fill="none" stroke="${a.bg === "#1d1a16" ? "#fffdf9" : "#1d1a16"}" stroke-width="1.6"/><path d="M30.2 37h3.6" stroke="#1d1a16" stroke-width="1.6"/>`;
    }
  }
  function avatarSVG(i) {
    const a = AV[((i % AV.length) + AV.length) % AV.length];
    const behind = a.style === "long" ? hairSVG(a) : "";
    const front = a.style === "long" ? "" : hairSVG(a);
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="${a.bg}"/>${behind}
      <ellipse cx="32" cy="66" rx="20" ry="14" fill="${a.shirt}"/><rect x="28" y="46" width="8" height="8" rx="3" fill="${a.skin}"/>
      <circle cx="32" cy="37" r="15" fill="${a.skin}"/>${front}
      <circle cx="26.5" cy="38" r="1.7" fill="#1d1a16"/><circle cx="37.5" cy="38" r="1.7" fill="#1d1a16"/>
      <path d="M27.5 44q4.5 3.6 9 0" stroke="#1d1a16" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`;
  }
  const profile = () => (db.profile ||= { name: "", headline: "", avatar: 0, photo: "" });
  const avatarHTML = (p = profile()) => p.photo ? `<img src="${esc(p.photo)}" alt="">` : avatarSVG(p.avatar || 0);
  function paintProfile() {
    $("#railAvatar").innerHTML = avatarHTML();
    $("#profileBtn").title = profile().name || "Profile";
  }
  const pDialog = $("#profileDialog"), pForm = $("#profileForm");
  let draft = null;
  function paintDraft() {
    $("#profilePreview").innerHTML = avatarHTML(draft);
    $("#avatarGrid").innerHTML = AV.map((_, i) => `<button type="button" class="avatar-opt ${!draft.photo && draft.avatar === i ? "on" : ""}" data-avatar="${i}" aria-label="Avatar ${i + 1}"><span class="avatar">${avatarSVG(i)}</span></button>`).join("");
    $("#removePhoto").hidden = !draft.photo;
  }
  function openProfile() {
    draft = { ...profile() };
    pForm.elements.name.value = draft.name; pForm.elements.headline.value = draft.headline;
    paintDraft(); pDialog.showModal();
  }
  $("#avatarGrid").addEventListener("click", (e) => { const b = e.target.closest("[data-avatar]"); if (!b) return; draft.avatar = +b.dataset.avatar; draft.photo = ""; paintDraft(); });
  $("#removePhoto").addEventListener("click", () => { draft.photo = ""; paintDraft(); });
  $("#photoFile").addEventListener("change", (e) => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {   // downscale to 256px so it fits in local storage
      const c = document.createElement("canvas"), n = 256, sc = Math.max(n / img.width, n / img.height);
      c.width = c.height = n;
      c.getContext("2d").drawImage(img, (n - img.width * sc) / 2, (n - img.height * sc) / 2, img.width * sc, img.height * sc);
      draft.photo = c.toDataURL("image/jpeg", 0.85); paintDraft(); URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f); e.target.value = "";
  });
  pForm.addEventListener("submit", (e) => {
    e.preventDefault();
    db.profile = { ...draft, name: pForm.elements.name.value.trim(), headline: pForm.elements.headline.value.trim() };
    save(); pDialog.close(); paintProfile(); render(); toast("Profile saved");
  });
  $("#profileBtn").addEventListener("click", openProfile);
  function greeting() {
    const h = new Date().getHours();
    return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  }

  function autoGrow(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
  document.querySelectorAll('input[name="timefmt"]').forEach((r) => {
    r.checked = r.value === (use24 ? "24" : "12");
    r.addEventListener("change", () => {
      use24 = r.value === "24";
      try { localStorage.setItem(TIME_KEY, use24 ? "1" : "0"); } catch (_) {}
      render();
    });
  });

  function render() {
    document.querySelectorAll("[data-view]").forEach((b) => {
      if (b.closest("#view")) return;
      b.classList.toggle("active", b.dataset.view === (ui.view === "role" ? "roles" : ui.view));
    });
    const views = { scores: () => window.PBLearn?.viewScores() || "", dashboard: viewDashboard, timeline: viewTimeline, roles: viewRoles, role: viewRole, docs: viewDocs, search: viewSearch };
    $("#view").innerHTML = (views[ui.view] || viewDashboard)();
    if (ui.view === "docs" && ui.docMode === "read") {
      const first = document.querySelector("#prose > h1:first-child");
      if (first && first.textContent.trim() === (docById(ui.docId)?.title || "").trim()) first.remove();
      document.querySelectorAll("#prose h2").forEach((h) => (h.id = "h-" + slug(h.textContent)));
    }
    bindDnD();
    document.querySelectorAll("textarea.title-input").forEach(autoGrow);
    (window.PB?.afterRender || []).forEach((f) => { try { f(); } catch (e) { console.error(e); } });
    if (pending) {
      const p = pending; pending = null;
      requestAnimationFrame(() => {
        const el = document.getElementById(p.scroll);
        if (!el) return;
        el.scrollIntoView({ behavior: "smooth", block: p.block || "center" });
        if (p.flash) { el.classList.add(p.flash); setTimeout(() => el.classList.remove(p.flash), 1800); }
      });
    }
  }

  // ---------- actions ----------
  function createRole(stage = "Saved") {
    const r = { id: uid("role"), company: "New company", title: "Role title", team: "", location: "", salary: "", link: "", stage, interviewAt: "", interviewNote: "", notes: "", createdAt: nowISO() };
    db.roles.push(r); save(); go("role", { roleId: r.id });
  }
  function createDoc(roleId = "", title = "", body = "", tags = []) {
    const d = { id: uid("doc"), roleId: roleId || "", title, body, tags, updatedAt: nowISO(), order: 900 };
    db.docs.unshift(d); save(); go("docs", { docId: d.id, docMode: "edit", docFilter: "all" });
    setTimeout(() => $(".title-input")?.focus(), 30);
  }
  function openRef(docId, heading) {
    go("docs", { docId, docMode: "read", docFilter: "all" }, heading ? { scroll: "h-" + slug(heading), block: "start", flash: "target" } : null);
  }
  function gotoSession(id) {
    const t = taskById(id); if (!t) return;
    if (isBreak(t)) ui.showBreaks = true;
    if (ui.tlKind !== "all" && ui.tlKind !== t.kind) ui.tlKind = "all";
    go("timeline", { tlRole: t.roleId || ui.tlRole }, { scroll: "s-" + id, flash: "flash" });
  }

  // session dialog
  const sDialog = $("#sessionDialog"), sForm = $("#sessionForm");
  let editingId = null;
  function openSessionDialog(id, dayKeyStr) {
    editingId = id || null;
    const t = id ? taskById(id) : null;
    const roleId = t?.roleId || activeRoleId() || "";
    $("#sessionDialogTitle").textContent = t ? "Edit session" : "New session";
    $("#sessionDelete").hidden = !t;
    sForm.elements.title.value = t?.title || "";
    sForm.elements.day.value = t ? dayKey(tStart(t)) : (dayKeyStr || dayKey(new Date()));
    sForm.elements.start.value = t ? hm24(tStart(t)) : "10:00";
    sForm.elements.end.value = t ? hm24(tEnd(t)) : "11:00";
    sForm.elements.kind.innerHTML = Object.entries(KINDS).map(([k, l]) => `<option value="${k}" ${(t?.kind || "study") === k ? "selected" : ""}>${l}</option>`).join("");
    sForm.elements.roleId.innerHTML = db.roles.map((r) => `<option value="${r.id}" ${r.id === roleId ? "selected" : ""}>${esc(r.company)} — ${esc(r.title)}</option>`).join("");
    const linked = new Set((t?.refs || []).map((r) => r.doc));
    $("#sessionDocs").innerHTML = [...db.docs].sort((a, b) => (a.order ?? 999) - (b.order ?? 999))
      .map((d) => `<label><input type="checkbox" value="${d.id}" ${linked.has(d.id) ? "checked" : ""}> <span class="mono muted">${docNum(d)}</span> ${esc(d.title || "Untitled")}</label>`).join("") || `<span class="muted">No documents yet.</span>`;
    sDialog.showModal();
    setTimeout(() => sForm.elements.title.focus(), 30);
  }
  sForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const f = sForm.elements;
    const start = new Date(`${f.day.value}T${f.start.value}`), end = new Date(`${f.day.value}T${f.end.value}`);
    if (!(end > start)) { toast("End must be after start"); return; }
    const chosen = [...$("#sessionDocs").querySelectorAll("input:checked")].map((i) => i.value);
    const t = editingId ? taskById(editingId) : { id: uid("task"), done: false, refs: [] };
    const keep = (t.refs || []).filter((r) => chosen.includes(r.doc));
    const added = chosen.filter((id) => !keep.some((r) => r.doc === id)).map((id) => ({ doc: id, heading: "" }));
    Object.assign(t, { title: f.title.value.trim(), kind: f.kind.value, roleId: f.roleId.value, start: start.toISOString(), end: end.toISOString(), due: f.day.value, refs: [...keep, ...added] });
    if (!editingId) db.tasks.push(t);
    save(); sDialog.close(); gotoSession(t.id);
  });
  $("#sessionDelete").addEventListener("click", () => {
    if (!editingId || !confirm("Delete this session?")) return;
    db.tasks = db.tasks.filter((t) => t.id !== editingId); save(); sDialog.close(); render();
  });

  $("#view").addEventListener("click", (e) => {
    const el = e.target.closest("button, a");
    if (!el) return;
    const ds = el.dataset;
    if (ds.startNew !== undefined) window.PBCloud?.openNewPrep();
    else if (ds.openProfile !== undefined) openProfile();
    else if (ds.openRef) openRef(ds.openRef, ds.heading);
    else if (ds.gotoSession) gotoSession(ds.gotoSession);
    else if (ds.viewInDay) go("timeline", {}, { scroll: "day-" + ds.viewInDay, block: "start" });
    else if (ds.goto) {
      const target = ds.goto === "now" ? (document.querySelector(".sess.current") || document.getElementById("now")) : document.getElementById(ds.goto);
      target?.scrollIntoView({ behavior: "smooth", block: ds.goto.startsWith("day-") ? "start" : "center" });
      if (!target && ds.goto === "now") toast("Nothing scheduled today");
    }
    else if (ds.kind) { ui.tlKind = ds.kind; persistUI(); render(); }
    else if (ds.toggleBreaks !== undefined) { ui.showBreaks = !ui.showBreaks; persistUI(); render(); }
    else if (ds.newSession !== undefined) openSessionDialog(null, ds.newSession);
    else if (ds.editSession) openSessionDialog(ds.editSession);
    else if (ds.openRole) go("role", { roleId: ds.openRole });
    else if (ds.viewIn) go(ds.viewIn, ds.tlRole ? { tlRole: ds.tlRole } : {});
    else if (ds.addRole) createRole(ds.addRole);
    else if (ds.openDoc) openRef(ds.openDoc, "");
    else if (ds.selectDoc) { ui.docId = ds.selectDoc; ui.docMode = "read"; persistUI(); render(); }
    else if (ds.newDoc !== undefined) createDoc(ds.newDoc);
    else if (ds.docMode) { ui.docMode = ds.docMode; persistUI(); render(); }
    else if (ds.toggleTask) { const t = taskById(ds.toggleTask); t.done = !t.done; save(); const y = window.scrollY; render(); window.scrollTo(0, y); toast(t.done ? "Session done" : "Marked not done"); }
    else if (ds.setStage) { roleById(ui.roleId).stage = ds.setStage; save(); render(); }
    else if (ds.delRole) {
      if (!confirm("Delete this role and its sessions? Documents are kept as General.")) return;
      db.roles = db.roles.filter((r) => r.id !== ds.delRole);
      db.tasks = db.tasks.filter((t) => t.roleId !== ds.delRole);
      db.docs.forEach((d) => { if (d.roleId === ds.delRole) d.roleId = ""; });
      save(); go("roles");
    }
    else if (ds.delDoc) {
      if (!confirm("Delete this document? Links to it on the timeline are removed.")) return;
      window.PBFiles?.deleteStoredFile(docById(ds.delDoc)).catch(() => {});
      db.docs = db.docs.filter((d) => d.id !== ds.delDoc);
      db.tasks.forEach((t) => { t.refs = (t.refs || []).filter((r) => r.doc !== ds.delDoc); });
      ui.docId = null; save(); render();
    }
    else if (ds.downloadDoc) {
      const d = docById(ds.downloadDoc);
      download(`${slug(d.title || "untitled")}.md`, /^#\s/.test(d.body) ? d.body : `# ${d.title}\n\n${d.body}`, "text/markdown");
    }
    else if (ds.saveResearch) {
      const q = ds.saveResearch, enc = encodeURIComponent(q);
      createDoc(activeRoleId() || "", `Research: ${q}`, `## Question\n${q}\n\n## Findings\n- \n\n## Sources\n- https://developer.apple.com/search/?q=${enc}\n- https://www.google.com/search?q=${enc}\n`, ["research"]);
    }
  });

  $("#view").addEventListener("submit", (e) => {
    const f = e.target.closest("[data-quick-add]");
    if (!f) return;
    e.preventDefault();
    const title = f.elements.title.value.trim(); if (!title) return;
    const day = f.dataset.quickAdd, now = new Date();
    let start = new Date(`${day}T${pad(now.getHours() + 1 > 22 ? 22 : now.getHours() + 1)}:00`);
    if (day !== dayKey(now)) start = new Date(`${day}T10:00`);
    db.tasks.push({ id: uid("task"), roleId: activeRoleId() || "", title, kind: "study", done: false, refs: [], due: day,
      start: start.toISOString(), end: new Date(start.getTime() + 36e5).toISOString() });
    save(); render(); setTimeout(() => document.querySelector("[data-quick-add] input")?.focus(), 0);
  });

  $("#view").addEventListener("input", (e) => {
    const el = e.target;
    if (el.dataset.roleField) {
      const r = roleById(ui.roleId); const k = el.dataset.roleField;
      r[k] = k === "interviewAt" ? (el.value ? new Date(el.value).toISOString() : "") : el.value;
      if (k === "interviewAt") delete r.interviewEnd;
      save(); if (k === "stage") render();
    } else if (el.dataset.docField) {
      const d = docById(ui.docId); const k = el.dataset.docField;
      d[k] = k === "tags" ? el.value.split(",").map((s) => s.trim()).filter(Boolean) : el.value;
      d.updatedAt = nowISO(); save();
      if (k === "roleId") render();
      if (k === "title") autoGrow(el);
      if (k === "title") { const c = document.querySelector(`[data-select-doc="${d.id}"] .ttl`); if (c) c.textContent = el.value || "Untitled"; }
    }
  });
  $("#view").addEventListener("change", (e) => {
    if (e.target.id === "docFilter") { ui.docFilter = e.target.value; ui.docId = null; persistUI(); render(); }
    if (e.target.id === "tlRole") { ui.tlRole = e.target.value; persistUI(); render(); }
  });
  $("#view").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.classList.contains("title-input")) { e.preventDefault(); $(".body-input")?.focus(); return; }
    if (e.key === "Tab" && e.target.classList.contains("body-input")) {
      e.preventDefault(); const t = e.target, s = t.selectionStart;
      t.setRangeText("    ", s, t.selectionEnd, "end"); t.dispatchEvent(new Event("input", { bubbles: true }));
    }
  });

  function bindDnD() {
    document.querySelectorAll(".role-tile[draggable]").forEach((tile) => tile.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", tile.dataset.openRole)));
    document.querySelectorAll(".col[data-stage]").forEach((col) => {
      col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("drop"); });
      col.addEventListener("dragleave", () => col.classList.remove("drop"));
      col.addEventListener("drop", (e) => {
        e.preventDefault(); const r = roleById(e.dataTransfer.getData("text/plain"));
        if (r) { r.stage = col.dataset.stage; save(); render(); toast(`${r.company} → ${r.stage}`); }
      });
    });
  }

  // search box
  const qInput = $("#q");
  qInput.value = ui.q;
  let qTimer;
  qInput.addEventListener("input", () => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { ui.q = qInput.value; persistUI(); if (ui.view !== "search") ui.view = "search"; render(); }, 120);
  });
  document.addEventListener("keydown", (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing) { e.preventDefault(); qInput.focus(); qInput.select(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); qInput.focus(); qInput.select(); }
  });

  // dialogs
  const newDialog = $("#newDialog"), dataDialog = $("#dataDialog");
  $("#newBtn").addEventListener("click", () => newDialog.showModal());
  $("#dataBtn").addEventListener("click", () => dataDialog.showModal());
  document.querySelectorAll("dialog").forEach((d) => d.addEventListener("click", (e) => { if (e.target === d || e.target.closest("[data-close]")) d.close(); }));
  newDialog.addEventListener("click", (e) => {
    const b = e.target.closest("[data-create]"); if (!b) return;
    newDialog.close();
    if (b.dataset.create === "role") createRole();
    if (b.dataset.create === "doc") createDoc(ui.view === "role" ? ui.roleId : activeRoleId() || "");
    if (b.dataset.create === "session") openSessionDialog(null);
  });

  function download(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $("#exportBtn").addEventListener("click", () => download(`prepboard-${dayKey(new Date())}.json`, JSON.stringify(db, null, 1), "application/json"));
  $("#importFile").addEventListener("change", async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.roles) || !Array.isArray(data.docs)) throw new Error("bad");
      db = normalize({ roles: data.roles, docs: data.docs, tasks: data.tasks || [], quizzes: data.quizzes || [], profile: data.profile || db.profile }); save(); dataDialog.close(); render(); toast("Imported");
    } catch (_) { toast("That file isn't a PrepBoard export"); }
    e.target.value = "";
  });
  $("#resetBtn").addEventListener("click", () => {
    if (!confirm("Remove everything stored in this browser? (Data in your account stays safe and syncs back when you sign in.)")) return;
    db = normalize({ ...blank(), profile: db.profile }); save(); dataDialog.close(); go("timeline"); toast("Reset");
  });

  // live clock: update countdowns every 30s; re-render the timeline/overview each minute so "now" moves
  setInterval(() => {
    document.querySelectorAll("[data-countdown]").forEach((c) => {
      const ms = Math.max(0, new Date(c.dataset.countdown) - Date.now());
      const v = [Math.floor(ms / 864e5), Math.floor(ms % 864e5 / 36e5), Math.floor(ms % 36e5 / 6e4)];
      c.querySelectorAll(".cd-cell b").forEach((b, i) => (b.textContent = pad(v[i])));
    });
  }, 30000);
  setInterval(() => {
    const busy = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector("dialog[open]");
    if (!busy && (ui.view === "timeline" || ui.view === "dashboard")) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  }, 60000);

  // ---------- API for cloud.js (accounts + sync) and the new-prep chat ----------
  window.PB = {
    get db() { return db; },
    setDb(next, storageKey) {
      if (storageKey) KEY = storageKey;
      db = normalize({ roles: next.roles || [], docs: next.docs || [], tasks: next.tasks || [], quizzes: next.quizzes || [], profile: next.profile || db.profile });
      try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (_) {}
      paintProfile(); render();
    },
    loadCached(storageKey) { try { const raw = localStorage.getItem(storageKey); return raw ? normalize(JSON.parse(raw)) : null; } catch (_) { return null; } },
    blank, save, render, go, toast, uid, esc, dayKey, pad, KINDS,
  };
  window.PBAvatar = avatarSVG;

  paintProfile();
  render();
  if (ui.view === "timeline") requestAnimationFrame(() => (document.querySelector(".sess.current") || document.getElementById("now"))?.scrollIntoView({ block: "center" }));
})();
</script>
<script src="cloud.js"></script>
<script src="ai.js"></script>
<script src="learn.js"></script>
<script src="files.js"></script>
</body>
</html>
