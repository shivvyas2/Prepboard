<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrepBoard</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root {
  /* warm beige base */
  --bg: #efe9df;
  --bg-2: #e9e1d3;
  --surface: #f7f2ea;
  --card: #fffdf9;
  --ink: #1d1a16;
  --ink-2: #4f4a42;
  --muted: #8c8579;
  --faint: #bcb4a6;
  --line: #e7dfd2;
  --line-2: #d9cfbf;
  /* accents */
  --cobalt: #1f4fd8;
  --cobalt-2: #1a43b8;
  --cobalt-soft: #e5ebfb;
  --sun: #f7c744;
  --sun-soft: #ebdcaf;
  --on-sun: #2b2410;
  --now: var(--cobalt);
  --shadow: 0 1px 0 rgba(60,45,20,.03), 0 10px 28px rgba(60,45,20,.07);
  --r-xl: 28px; --r-lg: 20px; --r-md: 14px;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-behavior: smooth; background: var(--bg-2); }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  min-height: 100vh; font-size: 14px; -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.mono { font-family: var(--mono); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 76px minmax(0, 1fr); min-height: 100vh; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0; position: sticky; top: 0; height: 100vh; }
.logo { width: 48px; height: 48px; border-radius: 13px; display: block; flex: none; margin-bottom: 6px; box-shadow: 0 0 0 1px var(--line-2); }
.rail-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--ink-2); transition: background .15s, color .15s, transform .1s; }
.rail-btn:hover { color: var(--ink); }
.rail-btn:active { transform: scale(.96); }
.rail-btn.active { background: var(--cobalt); color: #fff; border-color: var(--cobalt); }
.rail .spacer { flex: 1; }
.rail-btn svg { width: 20px; height: 20px; }

main { padding: 20px 24px 60px 4px; min-width: 0; }
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 0; background: transparent; padding: 10px 18px; border-radius: 999px; color: var(--ink-2); font-weight: 500; }
.tab:hover { color: var(--ink); }
.tab.active { background: var(--cobalt); color: #fff; }
.search { flex: 1; min-width: 200px; max-width: 420px; margin-left: auto; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; height: 44px; }
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; }
.search kbd { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 6px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.icon-btn:hover { color: var(--ink); border-color: var(--line-2); }
.icon-btn.sm { width: 34px; height: 34px; font-size: 13px; }
.btn-primary { height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--cobalt); color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none; }
.btn-ghost { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; }
.btn-ghost:hover { color: var(--ink); border-color: var(--ink-2); }

/* ---------- cards ---------- */
.card { background: var(--card); border-radius: var(--r-xl); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.panel { background: rgba(247,242,234,.75); border-radius: var(--r-xl); border: 1px solid var(--line); padding: 14px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.card-head .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.h-display { font-size: clamp(30px, 4vw, 46px); letter-spacing: -.04em; font-weight: 700; margin: 0; line-height: 1.02; }
.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-head .right { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 18px; min-width: 0; }

/* ---------- dashboard ---------- */
.dash { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; }
.dash > * { min-width: 0; }
.hero { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; }
.countdown { display: flex; gap: 10px; }
.cd-cell { background: var(--sun-soft); border: 1px solid #d9c38c; border-radius: var(--r-lg); padding: 12px 14px; min-width: 74px; text-align: center; }
.cd-cell b { display: block; font-size: 28px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.cd-cell span { font-size: 11px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: var(--surface); border-radius: var(--r-lg); padding: 14px; border: 1px solid var(--line); }
.stat b { font-size: 26px; display: block; letter-spacing: -.03em; }
.upnext { background: var(--cobalt); color: #fff; border-radius: var(--r-xl); padding: 22px; display: grid; gap: 12px; }
.upnext .label { color: var(--sun); }
.upnext h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; line-height: 1.2; }
.upnext .when { font-family: var(--mono); font-size: 13px; color: rgba(255,255,255,.7); }
.upnext .ref { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: #fff; }
.upnext .ref .n { background: var(--sun); color: var(--on-sun); border-color: var(--sun); }
.upnext .btn-ghost { color: #fff; border-color: rgba(255,255,255,.3); }
.agenda-row { display: grid; grid-template-columns: 46px 10px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border: 0; background: transparent; width: 100%; text-align: left; }
.agenda-row .t { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 1px; }
.agenda-row .d { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); margin-top: 4px; }
.agenda-row.done .d { background: var(--ink); }
.agenda-row.done .x { color: var(--muted); text-decoration: line-through; }
.agenda-row.current .d { border-color: var(--cobalt); background: var(--sun); box-shadow: 0 0 0 3px var(--sun-soft); }
.agenda-row.break .x { color: var(--muted); }
.agenda-row.break .d { border-color: var(--faint); border-style: dashed; }
.agenda-row .x { font-weight: 500; line-height: 1.35; }
.agenda-row:hover .x { text-decoration: underline; }

/* pipeline */
.pipeline { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.pipeline.compact .col { min-height: 0; }
.pipeline.compact .col:not(:has(.role-tile)) .col-head { opacity: .55; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px; min-height: 130px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.col.drop { outline: 2px dashed var(--ink-2); outline-offset: -4px; }
.col-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 6px; }
.col-head span { font-weight: 600; font-size: 13px; }
.count { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.role-tile { min-width: 0; overflow-wrap: anywhere; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; text-align: left; display: grid; gap: 4px; width: 100%; }
.role-tile:hover { border-color: var(--ink-2); }
.role-tile.hot { background: var(--cobalt); color: #fff; border-color: var(--cobalt); }
.role-tile.hot .muted { color: rgba(255,255,255,.6); }
.role-tile.hot .bar { background: rgba(255,255,255,.15); border-color: transparent; }
.role-tile.hot .bar i { background: var(--sun); }
.add-tile { border: 1px dashed var(--line-2); background: transparent; border-radius: var(--r-md); padding: 10px; color: var(--muted); }
.bar { height: 8px; background: var(--surface); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); display: block; }
.bar i { display: block; height: 100%; background: var(--cobalt); border-radius: 999px; }

/* ---------- timeline ---------- */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.pill .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.pill .sw { width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.pill.on { background: var(--cobalt); color: #fff; border-color: var(--cobalt); }
.pill.on .n { color: rgba(255,255,255,.6); }
.pill.soft { background: transparent; border-color: var(--line-2); }

.track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(180px, 1fr); overflow-x: auto; padding: 6px 2px 2px; }
.track-day { position: relative; padding: 0 16px 4px; border-left: 1px solid var(--line); min-width: 0; }
.track-day:first-child { border-left: 0; }
.track-day .dl { display: flex; align-items: baseline; gap: 6px; border: 0; background: transparent; padding: 0; text-align: left; }
.track-day .dl b { font-size: 22px; letter-spacing: -.03em; }
.track-day .dl span { font-size: 12px; color: var(--muted); font-weight: 500; }
.track-day.today .dl span { color: var(--now); }
.track-line { position: relative; height: 36px; margin-top: 10px; display: flex; align-items: center; gap: 6px; }
.track-line::before { content: ""; position: absolute; left: -16px; right: -16px; top: 50%; border-top: 1px solid var(--line-2); }
.dot { position: relative; z-index: 1; border-radius: 50%; background: var(--card); border: 1.5px solid var(--ink); flex: none; padding: 0; }
.dot:hover { transform: scale(1.15); }
.dot.done { background: var(--cobalt); border-color: var(--cobalt); }
.dot.break { border-color: var(--faint); border-style: dashed; }
.dot.missed { border-color: var(--faint); background: var(--surface); }
.dot.current { border-color: var(--cobalt); background: var(--sun); box-shadow: 0 0 0 4px var(--sun-soft); }
.dot.milestone { width: 36px; height: 36px; background: var(--sun); border-color: var(--on-sun); color: var(--on-sun); display: grid; place-items: center; font-size: 13px; }
.track-day .meta { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }

.day { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 22px; padding: 26px 0; border-top: 1px solid var(--line-2); scroll-margin-top: 16px; }
.day:first-child { border-top: 2px solid var(--cobalt); }
.day-num { position: sticky; top: 16px; align-self: start; }
.day-num .big { font-size: 84px; line-height: .86; font-weight: 800; letter-spacing: -.06em; display: flex; align-items: flex-start; gap: 6px; }
.day-num .big sup { font-size: 14px; letter-spacing: 0; font-weight: 600; color: var(--muted); margin-top: 8px; }
.day.today .day-num .big sup { color: var(--now); }
.day.past .day-num .big { color: var(--faint); }
.day-num .sub { margin-top: 12px; font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.day-num .bar { width: 120px; }
.sessions { display: grid; gap: 10px; min-width: 0; }

.sess { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 16px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; scroll-margin-top: 120px; transition: box-shadow .2s, border-color .2s; }
.sess:hover { border-color: var(--line-2); }
.sess-time { font-family: var(--mono); display: grid; gap: 2px; padding-top: 1px; }
.sess-time b { font-size: 15px; font-weight: 600; }
.sess-time span { font-size: 12px; color: var(--muted); }
.sess-body { min-width: 0; border-left: 1px solid var(--line); padding-left: 16px; display: grid; gap: 6px; }
.sess-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.kind { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.kind::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
.dur { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.sess-title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; overflow-wrap: anywhere; }
.refs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.ref { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 500; color: var(--ink); max-width: 100%; }
.ref:hover { border-color: var(--ink-2); }
.ref .n { font-family: var(--mono); font-size: 10px; font-weight: 600; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); flex: none; }
.ref .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess-actions { display: flex; gap: 6px; align-items: center; }
.sess.done .sess-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.sess.done { background: rgba(255,253,249,.5); }
.sess.missed:not(.break) { background: rgba(255,253,249,.72); }
.sess.missed:not(.break) .sess-time b { color: var(--muted); }
.sess.current { background: var(--cobalt); color: #fff; border-color: var(--cobalt); box-shadow: 0 12px 30px rgba(31,79,216,.25); }
.sess.current .sess-body { border-color: rgba(255,255,255,.15); }
.sess.current .sess-time span, .sess.current .dur { color: rgba(255,255,255,.6); }
.sess.current .ref { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: #fff; }
.sess.current .ref .n { background: var(--sun); color: var(--on-sun); border-color: var(--sun); }
.sess.current .icon-btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.25); }
.sess.current .kind { color: #fff; }
.sess.break { background: transparent; border-style: dashed; padding: 10px 18px; box-shadow: none; }
.sess.break .sess-title { font-size: 14px; font-weight: 500; color: var(--muted); }
.sess.flash { box-shadow: 0 0 0 3px var(--sun); }
.live-tag { font-size: 11px; font-weight: 700; color: var(--on-sun); background: var(--sun); border-radius: 6px; padding: 2px 7px; letter-spacing: .04em; }
.now-line { display: flex; align-items: center; gap: 10px; color: var(--now); font-family: var(--mono); font-size: 12px; font-weight: 600; scroll-margin-top: 140px; }
.now-line::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--now); }
.now-line::after { content: ""; flex: 1; border-top: 1.5px solid var(--now); }
.milestone-card { background: var(--sun); color: var(--on-sun); border-radius: var(--r-lg); padding: 20px 22px; display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 16px; align-items: center; scroll-margin-top: 120px; }
.milestone-card .sess-time span { color: rgba(43,36,16,.6); }
.milestone-card .t { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.milestone-card .s { color: rgba(43,36,16,.7); margin-top: 2px; }
.milestone-card .cd-cell { background: rgba(255,253,249,.55); border-color: rgba(43,36,16,.12); min-width: 58px; padding: 8px; }
.milestone-card .cd-cell b { font-size: 22px; }
.milestone-card .cd-cell span { color: rgba(43,36,16,.6); }
.empty-day { color: var(--muted); padding: 14px 0; }

.k-study { color: var(--cobalt); } .k-practice { color: var(--ink); } .k-mock { color: #c2410c; }
.k-review { color: #2f7d4f; } .k-logistics { color: #8a6d1f; } .k-break { color: var(--faint); }

/* checkboxes */
.check { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--ink-2); background: transparent; flex: none; padding: 0; display: grid; place-items: center; color: transparent; transition: background .12s; }
.check svg { width: 14px; height: 14px; }
.check:hover { background: var(--surface); }
.check.on { background: var(--cobalt); border-color: var(--cobalt); color: #fff; }
.sess.current .check { border-color: #fff; }
.sess.current .check.on { background: var(--sun); border-color: var(--sun); color: var(--on-sun); }

/* checklist (today's tasks) */
.checklist-head { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid var(--line-2); }
.checklist-head h3 { margin: 0; font-size: 22px; letter-spacing: -.02em; font-weight: 700; }
.checklist-head .of { color: var(--muted); font-size: 14px; }
.check-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 2px; border-bottom: 1px solid var(--line-2); }
.check-row .x { font-size: 15px; font-weight: 500; border: 0; background: transparent; padding: 0; text-align: left; line-height: 1.35; }
.check-row .x:hover { text-decoration: underline; }
.check-row .tm { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.check-row.done .x { color: var(--muted); text-decoration: line-through; }
.check-row.current .tm { color: var(--now); }
.add-row { display: flex; align-items: center; gap: 14px; padding: 14px 2px; border-bottom: 1px solid var(--line-2); }
.add-row span { font-size: 22px; line-height: 1; color: var(--ink-2); width: 22px; text-align: center; }
.add-row input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font-size: 15px; }
.add-row input::placeholder { color: var(--faint); }

.chip { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: var(--cobalt-soft); color: var(--cobalt); border: 0; white-space: nowrap; letter-spacing: .03em; }

/* doc rows */
.doc-row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--r-md); width: 100%; border: 0; background: transparent; text-align: left; min-width: 0; }
.doc-row:hover { background: var(--surface); }
.doc-ico { width: 36px; height: 36px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; flex: none; font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--ink-2); }
.doc-row .t { min-width: 0; flex: 1; }
.doc-row .t div:first-child { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- role detail ---------- */
.role-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; }
.role-layout > * { min-width: 0; }
.stepper { display: flex; gap: 6px; flex-wrap: wrap; }
.step { border: 1px solid var(--line-2); background: var(--card); border-radius: 999px; padding: 8px 14px; font-weight: 500; color: var(--ink-2); display: inline-flex; gap: 8px; align-items: center; }
.step .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.step.past { color: var(--ink); }
.step.past .n { color: var(--ink); }
.step.current { background: var(--cobalt); color: #fff; border-color: var(--cobalt); }
.step.past { background: var(--cobalt-soft); border-color: var(--cobalt-soft); }
.step.current .n { color: rgba(255,255,255,.65); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field input, .field textarea, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; outline: 0; width: 100%; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ink-2); }
.field.full { grid-column: 1 / -1; }
.field textarea { min-height: 90px; resize: vertical; }

/* ---------- docs workspace ---------- */
.docs { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 18px; align-items: start; }
.docs > * { min-width: 0; }
.doc-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; max-height: calc(100vh - 150px); overflow-y: auto; overflow-x: hidden; padding: 2px 4px 2px 2px; }
.doc-list > * { min-width: 0; }
.docs-side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; }
.docs-side select { width: 100%; min-width: 0; text-overflow: ellipsis; }
.page-head select, .meta-row select { max-width: 100%; min-width: 0; text-overflow: ellipsis; }
.doc-card > span { min-width: 0; }
.doc-card .ttl { overflow-wrap: anywhere; }
.group-label { padding: 12px 4px 2px; }
.doc-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px; text-align: left; width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.doc-card:hover { border-color: var(--line-2); }
.doc-card.active { border-color: var(--cobalt); box-shadow: 0 0 0 1px var(--cobalt); }
.doc-card .num { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 1px; }
.doc-card .ttl { font-weight: 600; font-size: 14px; letter-spacing: -.01em; line-height: 1.3; display: block; }
.doc-card .when { font-size: 12px; color: var(--muted); margin-top: 3px; display: block; }
.editor { min-height: calc(100vh - 110px); display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.editor-bar { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 500; color: var(--ink-2); }
.seg button.on { background: var(--cobalt); color: #fff; }
.editor-body { padding: 28px clamp(18px, 5vw, 64px) 60px; flex: 1; overflow: auto; }
.title-input { font-size: clamp(26px, 3vw, 38px); font-weight: 700; letter-spacing: -.035em; line-height: 1.12; border: 0; outline: 0; background: transparent; width: 100%; padding: 0; margin-bottom: 10px; resize: none; overflow: hidden; display: block; font-family: inherit; }
.meta-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.meta-row select, .meta-row input { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; outline: 0; font-size: 12px; max-width: 100%; }
.scheduled { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; margin-bottom: 22px; }
.scheduled-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; border: 0; background: transparent; text-align: left; padding: 2px 0; align-items: baseline; }
.scheduled-row .w { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.scheduled-row .s { font-size: 13px; }
.scheduled-row .s em { font-style: normal; color: var(--muted); }
.scheduled-row:hover .s { text-decoration: underline; }
.body-input { width: 100%; min-height: 60vh; border: 0; outline: 0; background: transparent; resize: none; font-family: var(--mono); font-size: 13px; line-height: 1.7; }
.prose { line-height: 1.65; max-width: 820px; }
.prose h1 { font-size: 30px; letter-spacing: -.03em; }
.prose h2 { font-size: 21px; letter-spacing: -.02em; margin-top: 2em; padding-top: .8em; border-top: 1px solid var(--line); scroll-margin-top: 20px; transition: background .4s; }
.prose h2.target { background: var(--sun-soft); box-shadow: -12px 0 0 var(--sun-soft), 12px 0 0 var(--sun-soft); border-radius: 4px; }
.prose h3 { font-size: 16px; margin-top: 1.6em; }
.prose code { font-family: var(--mono); font-size: .88em; background: var(--surface); border: 1px solid var(--line); padding: 1px 5px; border-radius: 6px; }
.prose pre { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; overflow-x: auto; }
.prose pre code { border: 0; padding: 0; background: transparent; }
.prose table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; font-size: 13px; }
.prose th, .prose td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
.prose th { background: var(--surface); }
.prose blockquote { margin: 0; padding: 4px 16px; border-left: 3px solid var(--cobalt); color: var(--ink-2); }
.prose hr { border: 0; border-top: 1px solid var(--line); }
.toc { display: grid; gap: 2px; margin-top: 10px; }
.toc a { text-decoration: none; color: var(--ink-2); font-size: 12px; padding: 4px 8px; border-radius: 8px; }
.toc a:hover { background: var(--surface); color: var(--ink); }

/* ---------- search ---------- */
.results { display: grid; gap: 10px; }
.result { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; text-align: left; width: 100%; display: grid; gap: 4px; }
.result:hover { border-color: var(--ink-2); }
.result mark { background: var(--sun); color: var(--on-sun); padding: 0 3px; border-radius: 4px; }
.web-links { display: flex; gap: 8px; flex-wrap: wrap; }

.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
dialog { border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--card); color: var(--ink); padding: 22px; width: min(560px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(43,36,16,.25); backdrop-filter: blur(4px); }
.form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.check-list { display: grid; gap: 4px; max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--surface); }
.check-list label { display: flex; gap: 8px; align-items: center; font-size: 13px; }

/* ---------- profile & avatars ---------- */
.avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; display: block; flex: none; background: var(--surface); }
.avatar svg, .avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
.profile-btn { border: 0; padding: 0; background: transparent; border-radius: 50%; box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--line-2); }
.profile-btn.rail-top { position: relative; margin-bottom: 18px; }
.profile-btn.rail-top .avatar { width: 48px; height: 48px; }
.profile-btn.rail-top::after { content: ""; position: absolute; right: -2px; top: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--sun); border: 2px solid var(--bg); }
.profile-btn:hover { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--cobalt); }
.avatar-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.avatar-opt { border: 0; padding: 0; background: transparent; border-radius: 50%; aspect-ratio: 1; }
.avatar-opt .avatar { width: 100%; height: 100%; }
.avatar-opt.on { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--cobalt); }
.profile-head { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
.profile-head .avatar { width: 72px; height: 72px; }
.greet { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.greet .avatar { width: 36px; height: 36px; }
.greet b { font-size: 15px; }

/* ---------- home ---------- */
.home { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; align-items: start; }
.home > * { min-width: 0; }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; }
.span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
.home .hero { align-self: stretch; }
.home .upnext { align-self: stretch; }
.timeleft { display: grid; gap: 8px; justify-items: end; }
.time-opt { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }
.time-opt input { appearance: none; width: 16px; height: 16px; border: 1.5px solid var(--line-2, #d9cfbf); border-radius: 4px; background: var(--card); margin: 0; display: grid; place-items: center; }
.time-opt input:checked { background: var(--cobalt); border-color: var(--cobalt); }
.time-opt input:checked::after { content: "✓"; color: #fff; font-size: 11px; font-weight: 800; line-height: 1; }
.stat.warn { background: var(--sun-soft); border-color: #d9c38c; }
.strip-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.strip { position: relative; min-width: 720px; }
.strip-grid { position: relative; height: 18px; margin-bottom: 6px; }
.strip-grid span { position: absolute; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--muted); }
.strip-grid span:first-child { transform: none; } .strip-grid span:last-child { transform: translateX(-100%); }
.strip-lane { position: relative; height: 74px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px calc(100% / 8)); border-radius: 14px; background-color: var(--surface); border: 1px solid var(--line); }
.blk { position: absolute; top: 8px; bottom: 8px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card); padding: 6px 8px; text-align: left; overflow: hidden; display: grid; align-content: start; gap: 2px; min-width: 0; border-left: 3px solid var(--ink); }
.blk .bt { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bm { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.blk.b-study { border-left-color: var(--cobalt); } .blk.b-mock { border-left-color: #c2410c; } .blk.b-review { border-left-color: #2f7d4f; } .blk.b-logistics { border-left-color: #8a6d1f; }
.blk.break { background: transparent; border-style: dashed; border-left-width: 1px; border-left-style: dashed; border-left-color: var(--line-2); }
.blk.break .bt { color: var(--muted); font-weight: 500; }
.blk.done { opacity: .55; } .blk.done .bt { text-decoration: line-through; }
.blk.current { background: var(--cobalt); border-color: var(--cobalt); color: #fff; }
.blk.current .bm { color: rgba(255,255,255,.7); }
.strip-now { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px solid var(--cobalt); z-index: 2; pointer-events: none; }
.strip-now span { position: absolute; bottom: -20px; left: -22px; font-family: var(--mono); font-size: 10px; font-weight: 600; color: #fff; background: var(--cobalt); padding: 1px 5px; border-radius: 5px; }
.strip-iv { position: absolute; top: 6px; bottom: 6px; width: 0; border-left: 2px dashed var(--on-sun); z-index: 2; }
.strip-iv span { position: absolute; top: -2px; left: 6px; font-size: 11px; font-weight: 700; background: var(--sun); color: var(--on-sun); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.prio-list { display: grid; }
.prio { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
.prio:last-child { border-bottom: 0; }
.prio:hover .ptt { text-decoration: underline; }
.pchip { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 8px; text-align: center; letter-spacing: .02em; }
.p-now { background: var(--sun); color: var(--on-sun); }
.p-catch { background: #fbe4d8; color: #c2410c; }
.p-next { background: var(--cobalt-soft); color: var(--cobalt); }
.pt { display: grid; gap: 3px; min-width: 0; }
.ptt { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.ptm { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.days-list { display: grid; gap: 6px; }
.day-row { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px; border-radius: 14px; border: 1px solid transparent; background: transparent; text-align: left; }
.day-row:hover { background: var(--surface); }
.day-row.today { background: var(--cobalt-soft); border-color: var(--cobalt-soft); }
.day-row .dn { font-size: 30px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.day-row.today .dn { color: var(--cobalt); }
.day-row .dd { display: grid; gap: 5px; min-width: 0; }
.day-row .dd b { font-size: 13px; }
.ivtag { justify-self: start; font-size: 11px; font-weight: 700; background: var(--sun); color: var(--on-sun); padding: 3px 8px; border-radius: 999px; }
@media (max-width: 1240px) {
  .c-hero, .c-up { grid-column: span 12; }
  .c-prio { grid-column: span 7; } .c-tasks { grid-column: span 5; }
  .c-days, .c-pipe, .c-recent { grid-column: span 12; }
  .days-list { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
}
@media (max-width: 900px) {
  .c-prio, .c-tasks { grid-column: span 12; }
  .home .hero { grid-template-columns: 1fr; }
  .timeleft { justify-items: start; }
}

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .dash, .role-layout { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; bottom: 0; top: auto; left: 0; right: 0; height: auto; flex-direction: row; justify-content: space-around; padding: 10px 16px; background: rgba(239,233,223,.94); backdrop-filter: blur(12px); z-index: 10; border-top: 1px solid var(--line); }
  .rail .spacer { display: none; }
  .profile-btn.rail-top { margin-bottom: 0; order: 10; }
  .profile-btn.rail-top .avatar { width: 40px; height: 40px; }
  main { padding: 16px 16px 100px; }
  .tabs { display: none; }
  .search { max-width: none; margin-left: 0; order: 3; flex-basis: 100%; }
  .hero { grid-template-columns: 1fr; }
  .cd-cell { min-width: 0; flex: 1; }
  .docs { grid-template-columns: minmax(0, 1fr); }
  .doc-list { max-height: none; }
  .fields, .form-grid { grid-template-columns: 1fr; }
  .day { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .day-num { position: static; }
  .day-num .big { font-size: 56px; }
  .sess { grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; padding: 14px; }
  .sess-body { padding-left: 12px; }
  .sess-actions { flex-direction: column; }
  .milestone-card { grid-template-columns: 48px minmax(0, 1fr); }
  .milestone-card .countdown { grid-column: 1 / -1; }
  .page-head .right { margin-left: 0; }
  .editor-body { padding: 22px 18px 40px; }
  .scheduled-row { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .avatar-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .profile-btn .avatar { width: 40px; height: 40px; }
  .track { grid-auto-columns: minmax(120px, 1fr); }
  .track-day { padding: 0 10px 4px; }
  .track-line { gap: 4px; flex-wrap: wrap; height: auto; min-height: 36px; }
  .track-line::before { left: -10px; right: -10px; }
  .track-day .dl span { font-size: 11px; }
}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Primary">
    <img class="logo" src="logo.svg" alt="PrepBoard" width="48" height="48">
    <button class="profile-btn rail-top" id="profileBtn" title="Profile" aria-label="Profile"><span class="avatar" id="railAvatar"></span></button>
    <button class="rail-btn" data-view="dashboard" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
    <button class="rail-btn" data-view="timeline" title="Timeline" aria-label="Timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="1.8" fill="currentColor"/><circle cx="15" cy="12" r="1.8" fill="currentColor"/><circle cx="10" cy="18" r="1.8" fill="currentColor"/></svg></button>
    <button class="rail-btn" data-view="roles" title="Roles" aria-label="Roles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    <button class="rail-btn" data-view="docs" title="Documents" aria-label="Documents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></button>
    <button class="rail-btn" data-view="scores" title="Scores" aria-label="Scores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></button>
    <button class="rail-btn" data-view="search" title="Search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <div class="spacer"></div>
    <button class="rail-btn" id="dataBtn" title="Import / export" aria-label="Import or export data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
  </nav>

  <main>
    <header class="topbar">
      <div class="tabs" role="tablist">
        <button class="tab" data-view="dashboard">Home</button>
        <button class="tab" data-view="timeline">Timeline</button>
        <button class="tab" data-view="roles">Roles</button>
        <button class="tab" data-view="docs">Documents</button>
        <button class="tab" data-view="scores">Scores</button>
        <button class="tab" data-view="search">Search</button>
      </div>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Search roles, docs, sessions…" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <button class="btn-primary" id="newBtn"><span style="font-size:18px;line-height:0">+</span> New</button>
    </header>
    <section id="view"></section>
  </main>
</div>

<dialog id="newDialog">
  <div class="card-head"><h3>Create</h3><div class="right"><button class="icon-btn sm" data-close aria-label="Close">✕</button></div></div>
  <div style="display:grid;gap:6px">
    <button class="doc-row" data-create="session"><span class="doc-ico">Se</span><span class="t"><div>Prep session</div><div class="muted">A time block on the timeline, linked to docs</div></span></button>
    <button class="doc-row" data-create="doc"><span class="doc-ico">Md</span><span class="t"><div>Document</div><div class="muted">Notes, research, guides (Markdown)</div></span></button>
    <button class="doc-row" data-create="role"><span class="doc-ico">Ro</span><span class="t"><div>Role</div><div class="muted">Track a company, stage and interview date</div></span></button>
  </div>
</dialog>

<dialog id="sessionDialog">
  <form id="sessionForm" style="display:grid;gap:12px">
    <div class="card-head" style="margin:0"><h3 id="sessionDialogTitle">New session</h3><div class="right"><button type="button" class="icon-btn sm" data-close aria-label="Close">✕</button></div></div>
    <label class="field"><span class="label">What</span><input name="title" required placeholder="e.g. Patterns 1–6, 2 problems each"></label>
    <div class="form-grid">
      <label class="field"><span class="label">Day</span><input name="day" type="date" required></label>
      <label class="field"><span class="label">Start</span><input name="start" type="time" required></label>
      <label class="field"><span class="label">End</span><input name="end" type="time" required></label>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <label class="field"><span class="label">Type</span><select name="kind"></select></label>
      <label class="field"><span class="label">Role</span><select name="roleId"></select></label>
    </div>
    <div class="field"><span class="label">Linked documents</span><div class="check-list" id="sessionDocs"></div></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn-ghost" id="sessionDelete" hidden>Delete</button><button class="btn-primary" type="submit">Save session</button></div>
  </form>
</dialog>

<dialog id="profileDialog">
  <form id="profileForm" style="display:grid;gap:14px">
    <div class="card-head" style="margin:0"><h3>Profile</h3><div class="right"><button type="button" class="icon-btn sm" data-close aria-label="Close">✕</button></div></div>
    <div class="profile-head"><span class="avatar" id="profilePreview"></span>
      <div style="display:grid;gap:6px;flex:1;min-width:0">
        <input name="name" placeholder="Your name" style="font-size:20px;font-weight:700;border:0;outline:0;background:transparent;padding:0;min-width:0">
        <input name="headline" placeholder="Headline, e.g. iOS engineer · New York" style="border:0;outline:0;background:transparent;padding:0;color:var(--ink-2);min-width:0">
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="label" style="margin-right:auto">Time format</span>
      <label class="time-opt"><input type="radio" name="timefmt" value="24"> 24-hour <span class="muted">19:00</span></label>
      <label class="time-opt"><input type="radio" name="timefmt" value="12"> 12-hour <span class="muted">7:00 PM</span></label>
    </div>
    <div class="label">Choose an avatar</div>
    <div class="avatar-grid" id="avatarGrid"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <label class="btn-ghost" style="cursor:pointer">Upload photo<input type="file" id="photoFile" accept="image/*" hidden></label>
      <button type="button" class="btn-ghost" id="removePhoto">Remove photo</button>
      <span class="muted" style="font-size:12px">Saved on this device</span>
      <button class="btn-primary" type="submit" style="margin-left:auto">Save</button>
    </div>
  </form>
</dialog>

<dialog id="dataDialog">
  <div class="card-head"><h3>Your data</h3><div class="right"><button class="icon-btn sm" data-close aria-label="Close">✕</button></div></div>
  <p class="muted" style="margin-top:0">Everything is saved in this browser. Export a JSON backup to move it, or to load it into the Mac/iOS app (Import).</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn-primary" id="exportBtn">Export JSON</button>
    <label class="btn-ghost" style="cursor:pointer">Import JSON<input type="file" id="importFile" accept="application/json" hidden></label>
    <button class="btn-ghost" id="resetBtn">Clear data on this device</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const STAGES = ["Saved", "Applied", "Recruiter", "Technical", "Onsite", "Offer", "Closed"];
  const KINDS = { study: "Study", practice: "Practice", mock: "Mock", review: "Review", logistics: "Logistics", break: "Break" };
  let KEY = "prepboard.v2";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = (p) => `${p}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  const nowISO = () => new Date().toISOString();
  const pad = (n) => String(n).padStart(2, "0");

  // ---------- storage ----------
  // Every account starts empty; plans are created with "Start something new".
  const blank = () => ({ roles: [], docs: [], tasks: [], quizzes: [] });
  function normalize(data) {
    data.tasks = (data.tasks || []).map((t) => {
      const out = { kind: "study", refs: [], videos: [], ...t };
      if (!out.start && out.due) { out.start = new Date(`${out.due}T09:00`).toISOString(); out.end = new Date(`${out.due}T10:00`).toISOString(); }
      if (!out.start) { out.start = nowISO(); out.end = new Date(Date.now() + 36e5).toISOString(); }
      return out;
    });
    data.quizzes = data.quizzes || [];
    data.docs = (data.docs || []).map((d) => ({ fileType: "md", filePath: "", ...d }));
    return data;
  }
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (_) {}
    return normalize(blank());
  }
  let db = load();
  let saveTimer;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (_) {} }, 200);
    window.PBCloud?.schedulePush?.();
  }

  const ui = { view: "dashboard", roleId: null, docId: null, docMode: "read", q: "", docFilter: "all", tlRole: null, tlKind: "all", showBreaks: true };
  try { Object.assign(ui, JSON.parse(sessionStorage.getItem("prepboard.ui2") || "{}")); } catch (_) {}
  const persistUI = () => { try { sessionStorage.setItem("prepboard.ui2", JSON.stringify(ui)); } catch (_) {} };

  // ---------- lookups ----------
  const roleById = (id) => db.roles.find((r) => r.id === id);
  const docById = (id) => db.docs.find((d) => d.id === id);
  const taskById = (id) => db.tasks.find((t) => t.id === id);
  const tStart = (t) => new Date(t.start);
  const tEnd = (t) => new Date(t.end || t.start);
  const isBreak = (t) => t.kind === "break";
  const sessionsFor = (roleId) => db.tasks.filter((t) => !roleId || t.roleId === roleId).sort((a, b) => tStart(a) - tStart(b));
  const workFor = (roleId) => sessionsFor(roleId).filter((t) => !isBreak(t));
  const progress = (roleId) => { const w = workFor(roleId); return w.length ? Math.round(100 * w.filter((x) => x.done).length / w.length) : 0; };
  const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  // Display times follow Profile → Time format (24-hour "19:00" or 12-hour "7:00 PM"); form inputs always use hm24.
  const TIME_KEY = "prepboard.time24";
  let use24 = true;
  try { use24 = localStorage.getItem(TIME_KEY) !== "0"; } catch (_) {}
  const hm24 = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const hm = (d) => use24 ? hm24(d) : `${d.getHours() % 12 || 12}:${pad(d.getMinutes())} ${d.getHours() < 12 ? "AM" : "PM"}`;
  const hourLabel = (h) => use24 ? `${pad(h)}:00` : `${h % 12 || 12} ${h < 12 || h === 24 ? "AM" : "PM"}`;
  const state = (t, now = new Date()) => t.done ? "done" : (tStart(t) <= now && now < tEnd(t)) ? "current" : tEnd(t) <= now ? "missed" : "upcoming";
  const dur = (t) => { const m = Math.round((tEnd(t) - tStart(t)) / 6e4); return m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? " " + (m % 60) + "m" : ""}` : `${m}m`; };
  const docNum = (d) => pad(Math.min(d?.order ?? 0, 99));
  const cleanHeading = (h) => (h || "").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}⭐]/gu, "").replace(/\s*\(.*$/, "").replace(/:.*$/, "").trim();
  const refLabel = (r) => { const d = docById(r.doc); return r.heading ? cleanHeading(r.heading) : (d ? cleanHeading(d.title.split(/[—]/)[0]) : "Missing doc"); };
  const slug = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  function nextInterview() {
    return db.roles.filter((r) => r.interviewAt && new Date(r.interviewAt) > Date.now() - 3600e3)
      .sort((a, b) => new Date(a.interviewAt) - new Date(b.interviewAt))[0];
  }
  function activeRoleId() {
    if (ui.tlRole && roleById(ui.tlRole)) return ui.tlRole;
    return nextInterview()?.id || db.roles[0]?.id || null;
  }

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }
  function fmtDate(d, opts = { month: "short", day: "numeric" }) { d = new Date(d); return isNaN(d) ? "" : d.toLocaleDateString(undefined, opts); }
  function fmtDateTime(iso) { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", hour12: localStorage.getItem("prepboard.time24") === "0", timeZoneName: "short" }); }
  function relative(iso) {
    const d = new Date(iso); if (isNaN(d)) return "";
    const s = (Date.now() - d) / 1000;
    if (s < 60) return "just now"; if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`; return fmtDate(d);
  }
  function md(text) {
    if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text || "", { gfm: true }));
    return `<pre>${esc(text)}</pre>`;
  }

  // ---------- navigation ----------
  let pending = null; // { scroll: elementId, block, flash: className }
  function go(view, extra = {}, after = null) { Object.assign(ui, { view }, extra); persistUI(); pending = after; render(); if (!after) window.scrollTo({ top: 0 }); }
  document.addEventListener("click", (e) => {
    const nav = e.target.closest("[data-view]");
    if (nav && !nav.closest("#view")) go(nav.dataset.view);
  });

  // ---------- shared fragments ----------
  function refChips(t) {
    return (t.refs || []).map((r) => {
      const d = docById(r.doc); if (!d) return "";
      return `<button class="ref" data-open-ref="${esc(r.doc)}" data-heading="${esc(r.heading || "")}" title="${esc(d.title)}${r.heading ? " › " + esc(r.heading) : ""}"><span class="n">${docNum(d)}</span><span class="l">${esc(refLabel(r))}</span></button>`;
    }).join("");
  }
  function countdownHTML(iso) {
    const ms = Math.max(0, new Date(iso) - Date.now());
    const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
    return [[d, "days"], [h, "hours"], [m, "min"]].map(([v, l]) => `<div class="cd-cell"><b>${pad(v)}</b><span>${l}</span></div>`).join("");
  }
  const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  const checkBtn = (t) => `<button class="check ${t.done ? "on" : ""}" data-toggle-task="${t.id}" role="checkbox" aria-checked="${t.done}" aria-label="Done: ${esc(t.title)}">${CHECK_SVG}</button>`;
  function checklistHTML(list, now) {
    return list.filter((t) => !isBreak(t)).map((t) => `<div class="check-row ${t.done ? "done" : ""} ${state(t, now)}">
      ${checkBtn(t)}<button class="x" data-goto-session="${t.id}">${esc(t.title)}</button><span class="tm">${hm(tStart(t))}</span></div>`).join("");
  }
  function agendaHTML(list, now) {
    return list.map((t) => `<button class="agenda-row ${state(t, now)} ${isBreak(t) ? "break" : ""}" data-goto-session="${t.id}">
      <span class="t">${hm(tStart(t))}</span><span class="d"></span><span class="x">${esc(t.title)}</span></button>`).join("");
  }
  function docRowHTML(d) {
    return `<button class="doc-row" data-open-doc="${d.id}"><span class="doc-ico">${(d.tags || []).includes("research") ? "Rs" : docNum(d)}</span>
      <span class="t"><div>${esc(d.title || "Untitled")}</div><div class="muted" style="font-size:12px">${esc(roleById(d.roleId)?.company || "General")} · ${esc(relative(d.updatedAt))}</div></span></button>`;
  }

  // ---------- TIMELINE ----------
  function viewTimeline() {
    const roleId = activeRoleId();
    const role = roleById(roleId);
    const now = new Date();
    const all = sessionsFor(roleId);
    const counts = Object.fromEntries(Object.keys(KINDS).map((k) => [k, all.filter((t) => t.kind === k).length]));
    const visible = all.filter((t) => (ui.tlKind === "all" || t.kind === ui.tlKind) && (ui.showBreaks || !isBreak(t)));
    const interviewKey = role?.interviewAt ? dayKey(new Date(role.interviewAt)) : null;

    const keys = new Set(all.map((t) => dayKey(tStart(t))));
    if (interviewKey) keys.add(interviewKey);
    const days = [...keys].sort();
    const todayKey = dayKey(now);

    const track = days.map((k) => {
      const ds = all.filter((t) => dayKey(tStart(t)) === k);
      const work = ds.filter((t) => !isBreak(t));
      const d = new Date(`${k}T12:00`);
      const dots = ds.map((t) => {
        const size = Math.round(Math.max(10, Math.min(22, 8 + (tEnd(t) - tStart(t)) / 6e4 / 12)));
        return `<button class="dot ${state(t, now)} ${isBreak(t) ? "break" : ""}" style="width:${size}px;height:${size}px" data-goto-session="${t.id}" title="${esc(hm(tStart(t)) + " · " + t.title)}" aria-label="${esc(hm(tStart(t)) + " " + t.title)}"></button>`;
      }).join("") + (k === interviewKey ? `<button class="dot milestone" data-goto="interview" title="Interview · ${esc(fmtDateTime(role.interviewAt))}" aria-label="Interview">★</button>` : "");
      return `<div class="track-day ${k === todayKey ? "today" : ""}">
        <button class="dl" data-goto="day-${k}"><b>${d.getDate()}</b><span>${d.toLocaleDateString(undefined, { weekday: "short", month: "short" })}${k === todayKey ? " · Today" : ""}</span></button>
        <div class="track-line">${dots}</div>
        <div class="meta">${work.length ? `${work.filter((t) => t.done).length}/${work.length} done` : ""}${k === interviewKey ? `${work.length ? " · " : ""}interview ${hm(new Date(role.interviewAt))}` : ""}</div>
      </div>`;
    }).join("");

    const dayBlocks = days.map((k) => {
      const d = new Date(`${k}T12:00`);
      const work = all.filter((t) => dayKey(tStart(t)) === k && !isBreak(t));
      const pct = work.length ? Math.round(100 * work.filter((t) => t.done).length / work.length) : 0;
      const items = visible.filter((t) => dayKey(tStart(t)) === k).map((t) => ({ t, at: tStart(t) }));
      if (k === interviewKey) items.push({ interview: true, at: new Date(role.interviewAt) });
      items.sort((a, b) => a.at - b.at);
      let rows = "", nowPlaced = k !== todayKey;
      for (const it of items) {
        if (!nowPlaced && it.at > now) { rows += `<div class="now-line" id="now">Now ${hm(now)}</div>`; nowPlaced = true; }
        if (it.interview) {
          const end = role.interviewEnd ? new Date(role.interviewEnd) : new Date(it.at.getTime() + 45 * 6e4);
          rows += `<div class="milestone-card" id="interview">
            <div class="sess-time"><b>${hm(it.at)}</b><span>${hm(end)}</span></div>
            <div><div class="label" style="color:rgba(43,36,16,.6)">Interview</div><div class="t">${esc(role.company)} — ${esc(role.title)}</div><div class="s">${esc(role.interviewNote || "")}</div></div>
            <div class="countdown" data-countdown="${esc(role.interviewAt)}" style="gap:6px">${countdownHTML(role.interviewAt)}</div>
          </div>`;
          continue;
        }
        const t = it.t, st = state(t, now);
        rows += `<div class="sess ${st} ${isBreak(t) ? "break" : ""}" id="s-${t.id}">
          <div class="sess-time"><b>${hm(tStart(t))}</b><span>${hm(tEnd(t))}</span></div>
          <div class="sess-body">
            ${isBreak(t) ? "" : `<div class="sess-meta"><span class="kind k-${t.kind}">${KINDS[t.kind] || t.kind}</span><span class="dur">${dur(t)}</span>${st === "current" ? `<span class="live-tag">NOW</span>` : ""}</div>`}
            <div class="sess-title">${esc(t.title)}</div>
            ${(t.refs || []).length ? `<div class="refs">${refChips(t)}</div>` : ""}
            ${isBreak(t) ? "" : (window.PBLearn?.videoStrip(t) || "") + `<div class="sess-learn"><button class="learn-btn" data-quiz-session="${t.id}"><span class="dotq"></span>Quiz me</button>${(t.videos || []).length ? "" : `<button class="learn-btn" data-videos-session="${t.id}">▶ Find videos</button>`}</div>`}
          </div>
          <div class="sess-actions">
            ${isBreak(t) ? "" : checkBtn(t)}
            <button class="icon-btn sm" data-edit-session="${t.id}" aria-label="Edit session" title="Edit">✎</button>
          </div>
        </div>`;
      }
      if (!nowPlaced) rows += `<div class="now-line" id="now">Now ${hm(now)}</div>`;
      return `<section class="day ${k === todayKey ? "today" : ""} ${k < todayKey ? "past" : ""}" id="day-${k}">
        <div class="day-num">
          <div class="big">${pad(d.getDate())}<sup>${d.toLocaleDateString(undefined, { weekday: "short" })}</sup></div>
          <div class="sub"><span>${d.toLocaleDateString(undefined, { month: "long" })}${k === todayKey ? " · Today" : ""}</span>
            ${work.length ? `<span class="bar"><i style="width:${pct}%"></i></span><span class="mono">${work.filter((t) => t.done).length}/${work.length} sessions</span>` : ""}
            <button class="btn-ghost" style="width:max-content;height:30px;font-size:12px" data-new-session="${k}">+ Session</button>
          </div>
        </div>
        <div class="sessions">${rows || `<div class="empty-day">Nothing scheduled.</div>`}</div>
      </section>`;
    }).join("");

    return `<div class="stack">
      <div class="page-head">
        <div><div class="label">Prep plan${role ? " · " + esc(role.company) + " — " + esc(role.title) : ""}</div><h1 class="h-display">Timeline</h1></div>
        <div class="right">
          ${db.roles.length > 1 ? `<select class="btn-ghost" id="tlRole" aria-label="Role">${db.roles.map((r) => `<option value="${r.id}" ${r.id === roleId ? "selected" : ""}>${esc(r.company)} — ${esc(r.title)}</option>`).join("")}</select>` : ""}
          <button class="btn-ghost" data-goto="now">Jump to now</button>
          <button class="btn-primary" data-new-session="">+ Session</button>
        </div>
      </div>
      ${days.length ? `<div class="card" style="padding:16px 4px 14px"><div class="track">${track}</div></div>` : ""}
      <div class="filters">
        <button class="pill ${ui.tlKind === "all" ? "on" : ""}" data-kind="all">All <span class="n">${all.filter((t) => !isBreak(t)).length}</span></button>
        ${Object.entries(KINDS).filter(([k]) => k !== "break").map(([k, l]) => `<button class="pill ${ui.tlKind === k ? "on" : ""}" data-kind="${k}"><span class="sw k-${k}"></span>${l} <span class="n">${counts[k]}</span></button>`).join("")}
        <button class="pill soft" data-toggle-breaks>${ui.showBreaks ? "Hide breaks" : "Show breaks"}</button>
      </div>
      <div>${dayBlocks || `<div class="card empty">No sessions yet. Add one to build your plan.</div>`}</div>
    </div>`;
  }

  // ---------- OVERVIEW ----------
  function pipelineHTML(compact) {
    return `<div class="pipeline ${compact ? "compact" : ""}">${STAGES.map((s) => {
      const roles = db.roles.filter((r) => r.stage === s);
      return `<div class="col" data-stage="${s}">
        <div class="col-head"><span>${s}</span><span class="count">${pad(roles.length)}</span></div>
        ${roles.map((r) => `<button class="role-tile ${r.stage === "Technical" || r.stage === "Onsite" ? "hot" : ""}" draggable="true" data-open-role="${r.id}">
            <span style="font-weight:600">${esc(r.company)}</span><span class="muted">${esc(r.title)}</span>
            ${r.interviewAt ? `<span class="muted mono" style="font-size:11px">${esc(fmtDate(r.interviewAt))}</span>` : ""}
            <span class="bar" style="margin-top:6px"><i style="width:${progress(r.id)}%"></i></span>
          </button>`).join("")}
        ${compact ? "" : `<button class="add-tile" data-add-role="${s}">+ Add</button>`}
      </div>`;
    }).join("")}</div>`;
  }

  function priorityItems(sess, now) {
    const work = sess.filter((t) => !isBreak(t) && !t.done);
    const missed = work.filter((t) => tEnd(t) <= now).map((t) => ({ t, level: "catch", label: "Catch up" }));
    const current = work.filter((t) => state(t, now) === "current").map((t) => ({ t, level: "now", label: "Now" }));
    const next = work.filter((t) => tStart(t) > now).slice(0, 4).map((t) => ({ t, level: "next", label: dayKey(tStart(t)) === dayKey(now) ? "Today" : fmtDate(tStart(t), { weekday: "short" }) }));
    return [...current, ...missed, ...next].slice(0, 6);
  }

  function dayStripHTML(sess, role, now) {
    const today = dayKey(now);
    const list = sess.filter((t) => dayKey(tStart(t)) === today);
    const startH = 7, endH = 23, span = (endH - startH) * 60;
    const pos = (d) => Math.max(0, Math.min(100, ((d.getHours() * 60 + d.getMinutes()) - startH * 60) / span * 100));
    const blocks = list.map((t) => {
      const st = state(t, now), l = pos(tStart(t)), w = Math.max(1.5, pos(tEnd(t)) - l);
      return `<button class="blk ${st} ${isBreak(t) ? "break" : ""} b-${t.kind}" style="left:${l}%;width:${w}%" data-goto-session="${t.id}" title="${esc(hm(tStart(t)) + "–" + hm(tEnd(t)) + " · " + t.title)}">
        <span class="bt">${esc(isBreak(t) ? t.title.split(/[+,.]/)[0] : t.title)}</span><span class="bm">${hm(tStart(t))}</span></button>`;
    }).join("");
    const iv = role?.interviewAt && dayKey(new Date(role.interviewAt)) === today
      ? `<div class="strip-iv" style="left:${pos(new Date(role.interviewAt))}%"><span>★ Interview ${hm(new Date(role.interviewAt))}</span></div>` : "";
    const nowH = now.getHours() + now.getMinutes() / 60;
    const nowMark = nowH >= startH && nowH <= endH ? `<div class="strip-now" style="left:${pos(now)}%"><span>${hm(now)}</span></div>` : "";
    const ticks = Array.from({ length: (endH - startH) / 2 + 1 }, (_, i) => startH + i * 2)
      .map((h) => `<span style="left:${(h - startH) / (endH - startH) * 100}%">${hourLabel(h)}</span>`).join("");
    return `<div class="strip-wrap"><div class="strip">
      <div class="strip-grid">${ticks}</div>
      <div class="strip-lane">${blocks || `<div class="muted" style="padding:18px 4px">Nothing scheduled today.</div>`}${iv}${nowMark}</div>
    </div></div>`;
  }

  function viewDashboard() {
    const now = new Date();
    const next = nextInterview();
    const roleId = activeRoleId();
    const role = roleById(roleId);
    const sess = sessionsFor(roleId);
    const current = sess.find((t) => state(t, now) === "current" && !isBreak(t));
    const upcoming = current || sess.find((t) => !t.done && !isBreak(t) && tEnd(t) > now);
    const today = sess.filter((t) => dayKey(tStart(t)) === dayKey(now));
    const tomorrowKey = dayKey(new Date(now.getTime() + 864e5));
    const agenda = today.length ? today : sess.filter((t) => dayKey(tStart(t)) === tomorrowKey);
    const work = workFor(roleId);
    const remaining = work.filter((t) => !t.done && tEnd(t) > now);
    const hoursLeft = remaining.reduce((n, t) => n + (tEnd(t) - Math.max(tStart(t), now)), 0) / 36e5;
    const missedCount = work.filter((t) => !t.done && tEnd(t) <= now).length;
    const recent = [...db.docs].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)).slice(0, 5);
    const prio = priorityItems(sess, now);
    const days = [...new Set([...work.map((t) => dayKey(tStart(t))), ...(role?.interviewAt ? [dayKey(new Date(role.interviewAt))] : [])])].sort();
    const ivKey = role?.interviewAt ? dayKey(new Date(role.interviewAt)) : "";
    return `<div class="home">
      <div class="card hero span-8 c-hero">
        <div>

  // ---------- SEARCH ----------
  function searchAll(q) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    const hit = (text) => { const t = (text || "").toLowerCase(); return terms.every((x) => t.includes(x)); };
    const score = (text) => terms.reduce((n, x) => n + ((text || "").toLowerCase().split(x).length - 1), 0);
    const out = [];
    db.roles.forEach((r) => { const blob = [r.company, r.title, r.team, r.notes, r.location, r.stage].join(" "); if (hit(blob)) out.push({ type: "Role", attr: `data-open-role="${r.id}"`, title: `${r.company} — ${r.title}`, text: r.notes || "", score: score(blob) + 50 }); });
    db.tasks.forEach((t) => { const blob = t.title + " " + (t.refs || []).map((r) => r.heading).join(" "); if (hit(blob)) out.push({ type: `Session · ${fmtDate(tStart(t), { weekday: "short", day: "numeric" })} ${hm(tStart(t))}`, attr: `data-goto-session="${t.id}"`, title: t.title, text: (t.refs || []).map(refLabel).join(" · "), score: 30 + score(blob) }); });
    db.docs.forEach((d) => {
      const blob = d.title + " " + d.body + " " + (d.tags || []).join(" ");
      if (!hit(blob)) return;
      const h = [...(d.body || "").matchAll(/^##\s+(.+)$/gm)].map((m) => m[1]).find((x) => terms.some((t) => x.toLowerCase().includes(t)));
      out.push({ type: "Document", attr: `data-open-ref="${d.id}" data-heading="${esc(h || "")}"`, title: d.title + (h ? ` › ${cleanHeading(h)}` : ""), text: d.body, score: score(d.title) * 20 + score(blob) });
    });
    return out.sort((a, b) => b.score - a.score).slice(0, 60);
  }
  function snippet(text, q) {
    const t = (text || "").replace(/\s+/g, " ");
    const first = q.toLowerCase().split(/\s+/).filter(Boolean)[0] || "";
    const i = Math.max(0, t.toLowerCase().indexOf(first) - 70);
    let s = esc((i > 0 ? "…" : "") + t.slice(i, i + 220) + (t.length > i + 220 ? "…" : ""));
    q.split(/\s+/).filter(Boolean).forEach((term) => { s = s.replace(new RegExp(`(${esc(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi"), "<mark>$1</mark>"); });
    return s;
  }
  function viewSearch() {
    const q = ui.q.trim();
    const results = searchAll(q);
    const enc = encodeURIComponent(q);
    const link = (href, label) => `<a class="btn-ghost" target="_blank" rel="noopener" href="${href}">${label} ↗</a>`;
    return `<div class="stack" style="max-width:900px">
      <div><div class="label">Search</div><h1 class="h-display">${q ? `“${esc(q)}”` : "Find anything"}</h1></div>
      ${q ? `<div class="card"><div class="card-head"><h3>Research on the web</h3></div><div class="web-links">
        ${link(`https://developer.apple.com/search/?q=${enc}`, "Apple Developer")}${link(`https://leetcode.com/problemset/?search=${enc}`, "LeetCode")}
        ${link(`https://www.google.com/search?q=${enc}`, "Web")}${link(`https://www.glassdoor.com/Search/results.htm?keyword=${enc}`, "Glassdoor")}
        <button class="btn-ghost" data-save-research="${esc(q)}">Save as research note</button>
      </div></div>` : ""}
      <div class="results">
        ${q ? (results.map((r) => `<button class="result" ${r.attr}><span class="label">${esc(r.type)}</span><span style="font-weight:600">${esc(r.title)}</span><span class="muted" style="font-size:13px">${snippet(r.text, q)}</span></button>`).join("") || `<div class="empty">No matches in your workspace.</div>`)
          : `<div class="empty">Type in the search bar. Press <span class="mono">/</span> anywhere to focus it.</div>`}
      </div>
    </div>`;
  }
