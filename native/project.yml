name: Prepboard
options:
  bundleIdPrefix: com.shivvyas
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Prepboard.xcconfig
  Release: Prepboard.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.9.2"
    CURRENT_PROJECT_VERSION: "13"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: PrepBoard
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.18.0   # 1.19+ adds a build plugin that needs manual trust in Xcode
targets:
  Prepboard-macOS:
    type: application
    platform: macOS
    sources:
      - path: Prepboard
        excludes: ["Seed/*"]
    dependencies:
      - package: Supabase
        product: Supabase
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: Prepboard
        PRODUCT_BUNDLE_IDENTIFIER: com.shivvyas.prepboard
        # Sandbox off so the app can launch the user's local `claude` CLI.
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_FILE: Prepboard-macOS-Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets: [Prepboard-macOSTests]
  Prepboard-macOSTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PrepboardTests]
    dependencies:
      - target: Prepboard-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivvyas.prepboard.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Prepboard.app/Contents/MacOS/Prepboard
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
  Prepboard-iOS:
    type: application
    platform: iOS
    sources:
      - path: Prepboard
        excludes: ["Seed/*"]
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_NAME: Prepboard
        PRODUCT_BUNDLE_IDENTIFIER: com.shivvyas.prepboard
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: Z42YU5W6WY   # Shiv Vyas (personal team)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "PrepBoard connects to Claude Code on your Mac when you pair them in Profile."
        # Plain HTTP only to local-network / private addresses (the paired Mac); everything else stays HTTPS.
        INFOPLIST_FILE: Prepboard-iOS-Info.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
